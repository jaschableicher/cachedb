name: Release benchmarks

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to benchmark and update
        required: true
        type: string

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Configure Release benchmarks
        run: cmake --preset linux-prod

      - name: Build
        run: cmake --build --preset linux-prod --parallel

      - name: Check benchmark workloads
        run: python3 tests/benchmarks/load_tests.py build/linux-prod

      - name: Run benchmarks and write job summary
        run: GITHUB_SHA="$(git rev-parse HEAD)" python3 benchmarks/run_ci.py --build-dir build/linux-prod --output-dir benchmark-results

      - name: Save benchmark report and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results/
          if-no-files-found: warn

  release_report:
    needs: benchmark
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download benchmark report
        uses: actions/download-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results

      - name: Attach report to release
        run: gh release upload "$RELEASE_TAG" benchmark-results/report.md benchmark-results/results.json --clobber

      - name: Show benchmark table in release notes
        run: |
          gh release view "$RELEASE_TAG" --json body > benchmark-results/release.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          directory = Path("benchmark-results")
          body = json.loads((directory / "release.json").read_text(encoding="utf-8"))["body"] or ""
          report = (directory / "report.md").read_text(encoding="utf-8").strip()
          title, _, details = report.partition("\n")
          if title != "# CacheDB benchmark results" or not details.strip():
              raise SystemExit("Benchmark report has an unexpected format")

          start = "<!-- cachedb-benchmarks:start -->"
          end = "<!-- cachedb-benchmarks:end -->"
          section = f"{start}\n## Benchmark results\n{details.strip()}\n{end}"
          if start in body or end in body:
              if body.count(start) != 1 or body.count(end) != 1 or body.index(start) > body.index(end):
                  raise SystemExit("Release notes contain invalid benchmark section markers")
              updated = body[:body.index(start)] + section + body[body.index(end) + len(end):]
          else:
              updated = body.rstrip() + ("\n\n" if body.strip() else "") + section + "\n"

          (directory / "release-notes.md").write_text(updated, encoding="utf-8")
          PY
          gh release edit "$RELEASE_TAG" --notes-file benchmark-results/release-notes.md
