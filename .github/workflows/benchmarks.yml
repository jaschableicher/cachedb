name: Benchmarks

on:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Release benchmarks
        run: cmake --preset linux-prod

      - name: Build
        run: cmake --build --preset linux-prod --parallel

      - name: Check benchmark workloads
        run: python3 tests/benchmarks/load_tests.py build/linux-prod

      - name: Run benchmarks and write job summary
        run: python3 benchmarks/run_ci.py --build-dir build/linux-prod --output-dir benchmark-results

      - name: Save benchmark report and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results/
          if-no-files-found: warn

  release_report:
    if: github.event_name == 'release'
    needs: benchmark
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download benchmark report
        uses: actions/download-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results

      - name: Attach report to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" benchmark-results/report.md benchmark-results/results.json --clobber
